<section class="page" id="page-admin-site-settings" aria-labelledby="siteSettingsTitle">
    <header class="page-header">
        <div>
            <p class="page-kicker">BRAND EXPERIENCE</p>
            <h2 id="siteSettingsTitle">시스템 설정</h2>
            <p>공개 홈페이지와 로그인·업무 홈에 적용할 브랜드 스킨을 선택합니다.</p>
        </div>
    </header>

    <section class="panel settings-panel" aria-labelledby="homepageSkinTitle">
        <div class="panel-header">
            <div>
                <h3 id="homepageSkinTitle">홈페이지 스킨</h3>
                <p>선택 즉시 현재 화면에 미리보기가 적용되며, 저장해야 전체 사용자에게 반영됩니다.</p>
            </div>
            <span class="settings-scope-badge">PUBLIC SITE · LOGIN · HOME</span>
        </div>

        <form id="siteSettingsForm">
            <div id="homepageSkinTemplates" class="skin-template-grid" role="radiogroup" aria-labelledby="homepageSkinTitle"></div>
            <p id="siteSettingsStatus" class="inline-status" aria-live="polite"></p>
            <div class="form-actions">
                <button id="resetSkinPreviewButton" class="button button-secondary" type="button">저장값으로 되돌리기</button>
                <button class="button button-primary" type="submit">스킨 저장</button>
            </div>
        </form>
    </section>
</section>
