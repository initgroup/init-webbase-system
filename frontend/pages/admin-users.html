<section class="page" id="page-admin-users" aria-labelledby="adminUsersTitle">
    <header class="page-header">
        <div>
            <h2 id="adminUsersTitle">사용자 관리</h2>
            <p>가입 사용자의 권한과 사용 여부를 관리합니다. 모든 변경은 서버 권한 검사를 통과해야 합니다.</p>
        </div>
    </header>

    <section class="panel">
        <form id="userSearchForm" class="toolbar" role="search">
            <label class="field grow">
                <span>검색어</span>
                <input id="userKeyword" class="input" type="search" maxlength="200" placeholder="로그인 ID, 이름 또는 이메일">
            </label>
            <label class="field">
                <span>사용 여부</span>
                <select id="userUseYn" class="select">
                    <option value="">전체</option>
                    <option value="Y">사용</option>
                    <option value="N">중지</option>
                </select>
            </label>
            <label class="field">
                <span>조회 건수</span>
                <select id="userLimit" class="select">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="200">200</option>
                </select>
            </label>
            <button class="button button-primary" type="submit">조회</button>
        </form>

        <p id="userListStatus" class="inline-status" aria-live="polite"></p>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th scope="col">로그인 ID</th>
                        <th scope="col">이름</th>
                        <th scope="col">이메일</th>
                        <th scope="col">권한</th>
                        <th scope="col">사용</th>
                        <th scope="col">관리</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </section>

    <dialog id="temporaryPasswordDialog" class="dialog">
        <header class="dialog-header">
            <div>
                <h3>임시 비밀번호</h3>
                <p>이 값은 지금 한 번만 표시될 수 있습니다. 안전한 방법으로 사용자에게 전달해 주세요.</p>
            </div>
            <button class="dialog-close" type="button" data-dialog-close aria-label="닫기">×</button>
        </header>
        <div class="dialog-body">
            <p id="temporaryPasswordValue" class="secret-result"></p>
        </div>
        <footer class="dialog-footer">
            <button id="copyTemporaryPasswordButton" class="button button-secondary" type="button">복사</button>
            <button class="button button-primary" type="button" data-dialog-close>확인</button>
        </footer>
    </dialog>
</section>
